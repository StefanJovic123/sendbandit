name = "sendbandit-queue-processor"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# Hyperdrive (Supabase PostgreSQL connection pooling)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "your-hyperdrive-id"
# Placeholder for local dev; keep credentials out of this file. To use a real database locally, set
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE in your shell (the services use supabase-js today).
localConnectionString = "postgresql://postgres:postgres@localhost:5432/postgres"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "your-kv-id" # Replace with actual KV ID

# Queue Consumer
[[queues.consumers]]
queue = "sendbandit-messages"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "sendbandit-messages-dlq"

# ============ Local Development ============
[env.local]
vars = { ENVIRONMENT = "development" }

[[env.local.queues.consumers]]
queue = "sendbandit-messages"
max_batch_size = 10
max_batch_timeout = 30
