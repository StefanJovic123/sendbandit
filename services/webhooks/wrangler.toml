name = "sendbandit-webhooks"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Production routes - uncomment after setting up domain
# routes = [
#   { pattern = "webhooks.sendbandit.com/*", zone_name = "sendbandit.com" }
# ]

[vars]
ENVIRONMENT = "production"

# Hyperdrive (Supabase PostgreSQL connection pooling)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "your-hyperdrive-id"
localConnectionString = "postgresql://postgres.nbfchbemfsythlypjwxi:ZVpUYDZa2smH5Y2p@aws-1-eu-west-1.pooler.supabase.com:5432/postgres"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "your-kv-id" # Replace with actual KV ID

# Queue Producer (for enqueuing incoming messages)
[[queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "sendbandit-messages"

# ============ Local Development ============
[env.local]
vars = { ENVIRONMENT = "development" }

[[env.local.queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "sendbandit-messages"
