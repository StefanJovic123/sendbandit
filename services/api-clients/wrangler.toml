name = "sendbandit-api-clients"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Production routes - uncomment after setting up domain
# routes = [
#   { pattern = "api.sendbandit.com/clients/*", zone_name = "sendbandit.com" }
# ]

[vars]
ENVIRONMENT = "development"
# Public URL of the webhooks worker, used in channel connections' webhook URLs. The deploy workflow sets the
# production URL (repository variable WEBHOOKS_URL, default https://webhooks.sendbandit.com).
WEBHOOKS_URL = "https://webhooks.sendbandit.local"

# Hyperdrive (Supabase PostgreSQL connection pooling)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "your-hyperdrive-id"
# Placeholder for local dev; keep credentials out of this file. To use a real database locally, set
# WRANGLER_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE in your shell (the services use supabase-js today).
localConnectionString = "postgresql://postgres:postgres@localhost:5432/postgres"

# KV Namespace (for caching, rate limiting)
[[kv_namespaces]]
binding = "KV"
id = "your-kv-id" # Replace with actual KV ID

# Queue Producer (for sending messages to queue-processor)
[[queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "sendbandit-messages"

# ============ Local Development ============
[env.local]
vars = { ENVIRONMENT = "development", WEBHOOKS_URL = "https://webhooks.sendbandit.local" }

[[env.local.queues.producers]]
binding = "MESSAGE_QUEUE"
queue = "sendbandit-messages"
